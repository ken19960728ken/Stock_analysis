[project]
name = "stock-analysis"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    # 共用（pipeline + analysis 兩邊都需要）
    "pandas",
    "numpy",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "lxml>=6.0.2",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
pipeline = [
    "finmind>=1.9.5",
    "yfinance",
    "tqdm>=4.67.3",
    "twstock>=1.4.0",
]
analysis = [
    "streamlit>=1.30.0",
    "fredapi>=0.5.0",
    "networkx>=3.0",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
test = ["pytest>=7.0.0"]
all = ["stock-analysis[pipeline,analysis,dashboard,test]"]

[tool.pytest.ini_options]
markers = ["api: 需要真實 API 呼叫的診斷測試（用 -m api 執行）"]
addopts = "-m 'not api'"
